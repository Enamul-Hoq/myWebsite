name: Update publications

# Runs every Monday at 06:00 UTC, and whenever you press the button on the
# Actions tab. If anything new turns up, it commits data/publications.json
# and GitHub Pages redeploys the site by itself.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new publications
        run: python scripts/update_publications.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "publications-bot"
          git config user.email "actions@github.com"
          git add data/publications.json
          git commit -m "Update publications ($(date -u +%Y-%m-%d))"
          git push
